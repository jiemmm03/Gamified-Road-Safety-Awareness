name: Build & Release Mobile APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Update Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/RoadSafe-AI.apk

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "RoadSafe AI v1.0.0 (Release APK)"
          body: |
            Official Android APK release for RoadSafe AI (Gamified Road Safety Awareness Mobile App).
            
            Download the RoadSafe-AI.apk file below and install it on your Android device.
            *Automatically built and updated via GitHub Actions CI/CD.*
          files: release-assets/RoadSafe-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
